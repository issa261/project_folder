<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الجيولوجي المتقدم - اليمن</title>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key }}&libraries=places"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .map-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #map {
            height: 400px;
            width: 100%;
            border-radius: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .analysis-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .analysis-section h4 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .analysis-section ul {
            list-style: none;
            padding: 0;
        }
        
        .analysis-section li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        
        .risk-high { color: #dc3545; font-weight: bold; }
        .risk-medium { color: #fd7e14; font-weight: bold; }
        .risk-low { color: #28a745; font-weight: bold; }
        
        .dem-image {
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin: 20px auto;
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #667eea;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #c33;
        }
        
        .success {
            background: #efe;
            color: #363;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #363;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 النظام الجيولوجي المتقدم - اليمن</h1>
            <p>نظام متكامل لتحليل التضاريس والتنقيب عن المعادن والكشف عن الفراغات</p>
        </div>
        
        <div class="main-content">
            <div class="control-panel">
                <h3>⚙️ إعدادات التحليل</h3>
                <div class="form-group">
                    <label for="lat">خط العرض (Latitude):</label>
                    <input type="text" id="lat" placeholder="خط العرض" value="{{ default_lat }}">
                </div>
                
                <div class="form-group">
                    <label for="lon">خط الطول (Longitude):</label>
                    <input type="text" id="lon" placeholder="خط الطول" value="{{ default_lon }}">
                </div>
                
                <div class="form-group">
                    <label for="bbox_size">حجم المنطقة (بالدرجات):</label>
                    <input type="number" id="bbox_size" value="0.03" step="0.01" min="0.01" max="0.1">
                    <small>القيمة الأصغر = منطقة أكثر دقة</small>
                </div>
                
                <button id="analyzeBtn" class="btn">
                    🔍 بدء التحليل الجيولوجي
                </button>
                
                <div id="statusMessage" style="margin-top: 15px;"></div>
            </div>
            
            <div class="map-container">
                <h3>🗺️ الخريطة التفاعلية</h3>
                <div id="map"></div>
                <p style="text-align: center; margin-top: 10px; color: #666;">
                    انقر على الخريطة لتحديد الموقع أو استخدم الإحداثيات يدوياً
                </p>
            </div>
        </div>
        
        <div class="results-panel" id="resultsPanel" style="display: none;">
            <div class="results-header">
                <h3>📊 نتائج التحليل الجيولوجي</h3>
                <div id="processingInfo"></div>
            </div>
            
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        let map;
        let marker;
        let currentAnalysis = null;

        function initMap() {
            const defaultPos = { 
                lat: parseFloat("{{ default_lat }}"), 
                lng: parseFloat("{{ default_lon }}") 
            };
            
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 10,
                center: defaultPos,
                mapTypeId: 'terrain',
                styles: [
                    {
                        featureType: "all",
                        elementType: "labels",
                        stylers: [{ visibility: "on" }]
                    }
                ]
            });
            
            marker = new google.maps.Marker({
                position: defaultPos,
                map: map,
                draggable: true,
                title: "موقع التحليل"
            });

            // تحديث الإحداثيات عند السحب
            marker.addListener('dragend', function() {
                const position = marker.getPosition();
                document.getElementById('lat').value = position.lat().toFixed(6);
                document.getElementById('lon').value = position.lng().toFixed(6);
            });

            // تحديث الإحداثيات عند النقر على الخريطة
            map.addListener('click', function(e) {
                marker.setPosition(e.latLng);
                document.getElementById('lat').value = e.latLng.lat().toFixed(6);
                document.getElementById('lon').value = e.latLng.lng().toFixed(6);
            });
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerHTML = `<div class="${type === 'error' ? 'error' : 'success'}">${message}</div>`;
        }

        function analyzeLocation() {
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const bbox_size = parseFloat(document.getElementById('bbox_size').value);
            
            // التحقق من صحة الإحداثيات
            if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                showStatus('❌ الرجاء إدخال إحداثيات صالحة', 'error');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ جاري التحليل...';
            btn.disabled = true;
            
            showStatus('⏳ جاري تحميل بيانات التضاريس وتحليلها...', 'info');
            
            fetch("/analyze", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ 
                    lat: lat, 
                    lon: lon, 
                    bbox_size: bbox_size 
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('خطأ في استجابة السيرفر');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    displayResults(data);
                    showStatus('✅ التحليل completed successfully!', 'success');
                } else {
                    throw new Error(data.error || 'حدث خطأ غير معروف');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showStatus(`❌ ${error.message}`, 'error');
            })
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        function displayResults(data) {
            const resultsPanel = document.getElementById('resultsPanel');
            const resultsContent = document.getElementById('resultsContent');
            const processingInfo = document.getElementById('processingInfo');
            
            resultsPanel.style.display = 'block';
            processingInfo.innerHTML = `<span>⏱️ ${data.processing_time} | 📊 ${data.data_quality}</span>`;
            
            let html = `
                <div class="success">
                    <strong>${data.message}</strong>
                </div>
                
                <div class="analysis-section">
                    <h4>🏔️ تحليل التضاريس</h4>
                    <ul>
                        <li>متوسط الارتفاع: <strong>${data.analysis_report.terrain_analysis.mean_elevation.toFixed(2)} متر</strong></li>
                        <li>أعلى ارتفاع: <strong>${data.analysis_report.terrain_analysis.max_elevation.toFixed(2)} متر</strong></li>
                        <li>أقل ارتفاع: <strong>${data.analysis_report.terrain_analysis.min_elevation.toFixed(2)} متر</strong></li>
                        <li>خشونة السطح: <strong>${data.analysis_report.terrain_analysis.roughness.toFixed(4)}</strong></li>
                        <li>متوسط الميل: <strong>${data.analysis_report.terrain_analysis.mean_slope.toFixed(2)}°</strong></li>
                    </ul>
                </div>
                
                <div class="analysis-section">
                    <h4>⚠️ تحليل الفراغات والكهوف</h4>
                    <ul>
                        <li>مناطق عالية الاحتمال: <strong>${data.analysis_report.void_analysis.statistics.high_probability_area.toFixed(2)}%</strong></li>
                        <li>مناطق متوسطة الاحتمال: <strong>${data.analysis_report.void_analysis.statistics.medium_probability_area.toFixed(2)}%</strong></li>
                        <li>مستوى المخاطر: <strong class="risk-${data.analysis_report.void_analysis.risk_assessment.level === 'مرتفع' ? 'high' : data.analysis_report.void_analysis.risk_assessment.level === 'متوسط' ? 'medium' : 'low'}">${data.analysis_report.void_analysis.risk_assessment.level}</strong></li>
                        <li>الإجراء الموصى: <strong>${data.analysis_report.void_analysis.risk_assessment.action}</strong></li>
                    </ul>
                </div>
                
                <div class="analysis-section">
                    <h4>💰 تحليل المعادن - الذهب</h4>
                    <ul>
                        <li>مستوى الثقة: <strong>${(data.gold_analysis.confidence * 100).toFixed(1)}%</strong></li>
                        <li>الحالة: <strong class="risk-${data.gold_analysis.status === 'مرتفع' ? 'high' : data.gold_analysis.status === 'متوسط' ? 'medium' : 'low'}">${data.gold_analysis.status}</strong></li>
                        <li>التوصية: <strong>${data.gold_analysis.recommendation}</strong></li>
                        <li>المؤشرات: <strong>${data.gold_analysis.indicators.join("، ")}</strong></li>
                    </ul>
                </div>
            `;
            
            if (data.void_locations && data.void_locations.high.length > 0) {
                html += `
                    <div class="analysis-section">
                        <h4>📍 مواقع الفراغات عالية الاحتمال</h4>
                        <ul>
                `;
                data.void_locations.high.forEach(loc => {
                    html += `
                        <li>
                            الموقع: ${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)} | 
                            الاحتمال: <strong>${(loc.probability * 100).toFixed(1)}%</strong> | 
                            المخاطر: <strong class="risk-${loc.risk === 'مرتفع' ? 'high' : 'medium'}">${loc.risk}</strong>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }
            
            if (data.image) {
                html += `
                    <div class="analysis-section">
                        <h4>🗺️ خريطة الارتفاع الرقمية (DEM)</h4>
                        <img src="data:image/png;base64,${data.image}" alt="خريطة الارتفاع" class="dem-image">
                    </div>
                `;
            }
            
            resultsContent.innerHTML = html;
            
            // التمرير إلى النتائج
            resultsPanel.scrollIntoView({ behavior: 'smooth' });
        }

        // الأحداث
        document.getElementById('analyzeBtn').addEventListener('click', analyzeLocation);
        
        // السماح بالضغط على Enter في حقول الإدخال
        ['lat', 'lon', 'bbox_size'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    analyzeLocation();
                }
            });
        });

        // التهيئة عند تحميل الصفحة
        window.onload = initMap;
    </script>
</body>
</html>
